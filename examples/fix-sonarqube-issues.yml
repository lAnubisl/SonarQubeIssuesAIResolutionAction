name: Fix SonarQube Issues With Copilot

on:
  workflow_dispatch:
    inputs:
      max_issues:
        description: Maximum number of SonarQube issues to attempt
        required: false
        default: "10"
      dry_run:
        description: Run without making changes
        required: false
        default: "true"

permissions:
  contents: write
  pull-requests: write

jobs:
  sonar-copilot-fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up project .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Set up project Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up project Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Fix SonarQube issues
        uses: your-org/sonar-copilot-fix-action@v1
        with:
          sonar_host_url: ${{ vars.SONAR_HOST_URL }}
          sonar_project_key: ${{ vars.SONAR_PROJECT_KEY }}
          components: ${{ vars.SONAR_PROJECT_KEY }}:src/Example.cs,${{ vars.SONAR_PROJECT_KEY }}:src/Other.cs
          sonar_branch: ${{ github.ref_name }}
          max_issues: ${{ inputs.max_issues }}
          statuses: OPEN
          severities: CRITICAL,BLOCKER
          impactSoftwareQualities: RELIABILITY,SECURITY
          impactSeverities: HIGH
          cleanCodeAttributeCategories: INTENTIONAL
          rules: csharpsquid:S1234,csharpsquid:S5678
          dry_run: ${{ inputs.dry_run }}
          copilot_allowed_tools: "shell(dotnet:*),shell(python:*),shell(java:*)"
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          COPILOT_CLI_TOKEN: ${{ secrets.COPILOT_CLI_TOKEN }}
          GH_CLI_TOKEN: ${{ secrets.GH_CLI_TOKEN }}
