name: Fix SonarQube issues with Copilot

on:
  workflow_dispatch:
    inputs:
      Issues_to_fix:
        description: Maximum issues to fix
        default: "10"
      Type:
        description: SonarQube issue type
        required: false
        type: choice
        default: ALL
        options:
          - ALL
          - CODE_SMELL
          - BUG
          - VULNERABILITY
      Type_Severity:
        description: SonarQube issue severity
        type: choice
        required: false
        default: ALL
        options:
          - ALL
          - BLOCKER
          - CRITICAL
          - MAJOR
          - MINOR
          - INFO
      Software_quality:
        description: SonarQube impact software quality
        type: choice
        required: false
        default: ALL
        options:
          - ALL
          - RELIABILITY
          - SECURITY
          - MAINTAINABILITY
      Severity:
        description: SonarQube impact severity
        type: choice
        required: false
        default: ALL
        options:
          - ALL
          - BLOCKER
          - HIGH
          - MEDIUM
          - LOW
          - INFO

permissions:
  contents: write
  pull-requests: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fix SonarQube issues
        uses: lAnubisl/SonarQubeIssuesAIResolutionAction@main
        with:
          sonar_host_url: https://sonarcloud.io
          sonar_project_key: lAnubisl_SonarQubeIssuesAIResolutionAction
          sonar_branch: main
          statuses: OPEN
          type: ${{ inputs.Type != 'ALL' && inputs.Type || '' }}
          severities: ${{ inputs.Type_Severity != 'ALL' && inputs.Type_Severity || '' }}
          impactSoftwareQualities: ${{ inputs.Software_quality != 'ALL' && inputs.Software_quality || '' }}
          impactSeverities: ${{ inputs.Severity != 'ALL' && inputs.Severity || '' }}
          max_issues: ${{ inputs.Issues_to_fix }}
          copilot_allow_all_tools: true
          copilot_extra_instructions: |
            Make sure `dotnet build` command reports no errors or failures after the fixes (otherwise fix them).
            Make sure `dotnet test` command reports no errors or failures after the fixes (otherwise fix them).
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          COPILOT_CLI_TOKEN: ${{ secrets.COPILOT_CLI_TOKEN }}
          GH_CLI_TOKEN: ${{ secrets.GH_CLI_TOKEN }}
