name: SonarQube Copilot Fix
description: Group selected SonarQube issues by rule and fix each group in an isolated Copilot session and draft pull request.
author: sonar-copilot-fix

inputs:
  sonar_host_url:
    description: SonarQube Server or SonarQube Cloud base URL.
    required: true
  sonar_project_key:
    description: SonarQube project key.
    required: true
  components:
    description: "Comma-separated SonarQube component keys. Defaults to sonar_project_key. Use projectKey:path/to/file to select source files."
    required: false
  sonar_branch:
    description: Optional SonarQube branch.
    required: false
  sonar_organization:
    description: Optional SonarQube Cloud organization.
    required: false
  max_issues:
    description: Maximum number of issues to select.
    required: false
    default: "10"
  statuses:
    description: Comma-separated SonarQube issue statuses.
    required: false
    default: "OPEN"
  type:
    description: "SonarQube issue type. Must be one of: CODE_SMELL, BUG, VULNERABILITY."
    required: false
  severities:
    description: "Comma-separated SonarQube severities. Example value: BLOCKER,CRITICAL,MAJOR,MINOR,INFO"
    required: false
  impactSoftwareQualities:
    description: Comma-separated SonarQube impact software qualities.
    required: false
  impactSeverities:
    description: "Comma-separated SonarQube impact severities. Example value: INFO, LOW, MEDIUM, HIGH, BLOCKER"
    required: false
  cleanCodeAttributeCategories:
    description: "Comma-separated clean code attribute categories or equivalent supported filter values. Possivle values: ADAPTABLE, CONSISTENT, INTENTIONAL, RESPONSIBLE. Example value: ADAPTABLE,INTENTIONAL"
    required: false
  rules:
    description: "Comma-separated SonarQube rule keys. Example value: java:S1144"
    required: false
  include_rule_details:
    description: Include SonarQube rule details in the prompt.
    required: false
    default: "true"
  include_code_snippets:
    description: Include local code snippets in the prompt.
    required: false
    default: "true"
  code_snippet_context_lines:
    description: Number of local context lines around each issue.
    required: false
    default: "20"
  copilot_model:
    description: Optional model name to pass to GitHub Copilot CLI.
    required: false
  copilot_extra_instructions:
    description: Extra reviewer-approved instructions to include in the Copilot prompt.
    required: false
  branch_prefix:
    description: Prefix for generated fix branches.
    required: false
    default: copilot/sonar-fixes
  base_branch:
    description: Base branch for the pull request. Defaults to detected repository default branch.
    required: false
  pull_request_draft:
    description: Create a draft pull request.
    required: false
    default: "true"
  fail_if_no_issues:
    description: Fail when no matching SonarQube issues are found.
    required: false
    default: "false"
  copilot_allowed_tools:
    description: "Comma-separated Copilot CLI permission patterns to add alongside file writes. Example: shell(dotnet:*),shell(python:*)"
    required: false
  copilot_allow_all_tools:
    description: Allow unrestricted Copilot CLI tool execution, overriding copilot_allowed_tools. When false, file writes and configured patterns are pre-approved.
    required: false
    default: "false"

outputs:
  prompt_file:
    description: Path to the last generated Copilot prompt file.
    value: ${{ steps.run.outputs.prompt_file }}
  pull_request_url:
    description: URL of the last created pull request, when one is created.
    value: ${{ steps.run.outputs.pull_request_url }}
  pull_request_urls:
    description: JSON array containing every created pull request URL.
    value: ${{ steps.run.outputs.pull_request_urls }}
  prompt_files:
    description: JSON array containing the generated prompt path for each selected rule group.
    value: ${{ steps.run.outputs.prompt_files }}
  selected_issue_count:
    description: Number of selected SonarQube issues.
    value: ${{ steps.run.outputs.selected_issue_count }}
  selected_rule_group_count:
    description: Number of rule groups formed from the selected SonarQube issues.
    value: ${{ steps.run.outputs.selected_rule_group_count }}

runs:
  using: composite
  steps:
    - name: Set up .NET for the action
      uses: actions/setup-dotnet@v5
      env:
        SONAR_TOKEN: ""
        COPILOT_CLI_TOKEN: ""
        GH_CLI_TOKEN: ""
        GITHUB_TOKEN: ""
      with:
        dotnet-version: 10.0.x

    - name: Install GitHub Copilot CLI
      shell: bash
      env:
        SONAR_TOKEN: ""
        COPILOT_CLI_TOKEN: ""
        GH_CLI_TOKEN: ""
        GITHUB_TOKEN: ""
        COPILOT_CLI_VERSION: v1.0.65
      run: |
        set -euo pipefail
        install_root="${RUNNER_TEMP}/sonar-copilot-fix/copilot/${COPILOT_CLI_VERSION}"
        if [[ ! -x "${install_root}/bin/copilot" ]]; then
          mkdir -p "${install_root}"
          curl -fsSL https://gh.io/copilot-install \
            | VERSION="${COPILOT_CLI_VERSION}" PREFIX="${install_root}" bash
        fi
        "${install_root}/bin/copilot" version
        echo "${install_root}/bin" >> "${GITHUB_PATH}"

    - name: Run SonarQube Copilot Fix
      id: run
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_SONAR_HOST_URL: ${{ inputs.sonar_host_url }}
        INPUT_SONAR_PROJECT_KEY: ${{ inputs.sonar_project_key }}
        INPUT_COMPONENTS: ${{ inputs.components }}
        INPUT_SONAR_BRANCH: ${{ inputs.sonar_branch }}
        INPUT_SONAR_ORGANIZATION: ${{ inputs.sonar_organization }}
        INPUT_MAX_ISSUES: ${{ inputs.max_issues }}
        INPUT_STATUSES: ${{ inputs.statuses }}
        INPUT_TYPE: ${{ inputs.type }}
        INPUT_SEVERITIES: ${{ inputs.severities }}
        INPUT_IMPACT_SOFTWARE_QUALITIES: ${{ inputs.impactSoftwareQualities }}
        INPUT_IMPACT_SEVERITIES: ${{ inputs.impactSeverities }}
        INPUT_CLEAN_CODE_ATTRIBUTE_CATEGORIES: ${{ inputs.cleanCodeAttributeCategories }}
        INPUT_RULES: ${{ inputs.rules }}
        INPUT_INCLUDE_RULE_DETAILS: ${{ inputs.include_rule_details }}
        INPUT_INCLUDE_CODE_SNIPPETS: ${{ inputs.include_code_snippets }}
        INPUT_CODE_SNIPPET_CONTEXT_LINES: ${{ inputs.code_snippet_context_lines }}
        INPUT_COPILOT_MODEL: ${{ inputs.copilot_model }}
        INPUT_COPILOT_EXTRA_INSTRUCTIONS: ${{ inputs.copilot_extra_instructions }}
        INPUT_BRANCH_PREFIX: ${{ inputs.branch_prefix }}
        INPUT_BASE_BRANCH: ${{ inputs.base_branch }}
        INPUT_PULL_REQUEST_DRAFT: ${{ inputs.pull_request_draft }}
        INPUT_FAIL_IF_NO_ISSUES: ${{ inputs.fail_if_no_issues }}
        INPUT_COPILOT_ALLOWED_TOOLS: ${{ inputs.copilot_allowed_tools }}
        INPUT_COPILOT_ALLOW_ALL_TOOLS: ${{ inputs.copilot_allow_all_tools }}
      run: |
        set -euo pipefail
        cd "${ACTION_PATH}"
        dotnet run \
          --project src/SonarCopilotFix/SonarCopilotFix.csproj \
          --configuration Release \
          --no-launch-profile
